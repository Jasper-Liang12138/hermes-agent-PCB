# ============================================================
# PCB BGA 逃逸布线智能体 — 配置文件
# 修改本文件后重启程序生效
# ============================================================

[tool-planning-chat-model]
# 主模型：除拆线重布生成外，普通 chat、意图识别、工具调用、skill 链路都使用这里
api_key  =
model    =
base_url =

[reroute-model]
# 拆线重布模型：仅拆线重布生成/DRC 迭代时使用这里
api_key  =
model    =
base_url =

# 拆线重布模型单次输出 token 上限；现场可调，修改后重启程序生效
max_tokens = 2048

[model]
# 兼容旧版单模型配置；如果上面的分段模型未填写，则可继续使用这里的 api_key/model/base_url
api_key  =
model    =
base_url =

# 版图数据传输模式：
#   0（默认）— PCB 客户端直接返回 S 表达式字符串
#   1        — PCB 客户端返回文件路径，Agent 自动读取文件内容
board_data_use_file_path = 1

[network]
# PCB 模型请求网络策略：
#   auto   — bypass_hosts 直连，其它地址沿用环境/系统代理
#   direct — PCB 模型请求全部直连，不使用代理
#   proxy  — PCB 模型请求使用下方代理；未填写则沿用环境/系统代理
proxy_mode = auto
bypass_hosts = wishub-x5.ctyun.cn
http_proxy =
https_proxy =

[pcb]
# 是否启用长上下文版图分析模块进行 BGA 提取
#   true（默认）— 使用内置模块解析版图，精度更高
#   false       — 由大模型直接分析原始版图数据
use_long_context_module = true

[explain]
# 本地可解释性分类模型权重，默认位置由 Git LFS 管理
checkpoint_path = model/best.pt

# 可选：本地可解释性推理过程文件输出目录；留空则使用系统临时目录
output_root =

[router]
# 布线器工作目录（输入/输出文件均在此目录下）
work_dir = .\router_work

# 北科大 0518 布线器
arc_dir = .\routers\arc_windows_0519
135_dir = .\routers\135_windows_0519

# 嘉栋 RL 布线器（bk_routing）；rl_root_dir 可按平台自动选择子目录
rl_root_dir = .\routers
rl_arc_dir = .\routers\arc_windows_0519
rl_135_dir = .\routers\135_windows_0519

# RL 层分配/逃逸顺序搜索运行时。交付版可放置 portable Python 到 .\python_runtime\python.exe
rl_python = .\python_runtime\python.exe
rl_eval_budget = 20
rl_timeout_seconds = 1800
rl_device = cpu

[server]
# WebSocket 监听地址和端口
host = 0.0.0.0
port = 7074
