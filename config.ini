# ============================================================
# PCB BGA 逃逸布线智能体 — 配置文件
# 修改本文件后重启程序生效
# ============================================================

[model]
# 大模型 API 密钥
api_key  =

# 模型名称（DashScope 示例：qwen-plus / qwen3-32b）
model    =

# API 接入地址（DashScope OpenAI 兼容模式）
base_url =

# 版图数据传输模式：
#   0（默认）— PCB 客户端直接返回 S 表达式字符串
#   1        — PCB 客户端返回文件路径，Agent 自动读取文件内容
board_data_use_file_path = 1

[pcb]
# 是否启用长上下文版图分析模块进行 BGA 提取
#   true（默认）— 使用内置模块解析版图，精度更高
#   false       — 由大模型直接分析原始版图数据
use_long_context_module = true

[explain]
# 本地可解释性分类模型权重，默认位置由 Git LFS 管理
checkpoint_path = model/best.pt

# 可选：本地可解释性推理过程文件输出目录；留空则使用系统临时目录
output_root =

[router]
# 布线器工作目录（输入/输出文件均在此目录下）
work_dir = /Users/zhuchenyuan/Desktop/routers/work

# 北科大 0518 布线器（Mac 开发请用 Windows 机器或 WSL 执行 .exe）
arc_dir = /Users/zhuchenyuan/Desktop/0518/弧形走线
135_dir = /Users/zhuchenyuan/Desktop/0518/135度走线

# 嘉栋 RL 布线器（bk_routing）；rl_root_dir 可按平台自动选择子目录
rl_root_dir = /Users/zhuchenyuan/Desktop/bk_routing
rl_arc_dir = /Users/zhuchenyuan/Desktop/bk_routing/arc_linux_0519
rl_135_dir = /Users/zhuchenyuan/Desktop/bk_routing/135_linux_0519

[server]
# WebSocket 监听地址和端口
host = 0.0.0.0
port = 8765
