[reroute-model]
# 本项目只使用一个模型，运行时统一命名为 pcb-model。
api_key = YOUR_API_KEY
model = YOUR_MODEL_ID
base_url = https://example.com/v1
max_tokens = 65536

[model]
board_data_use_file_path = 1

[router]
work_dir = .\router_work
arc_dir = .\routers\弧形走线
135_dir = .\routers\135度走线
rl_root_dir = .\routers
rule_135_dir = .\routers\135度走线
rule_arc_dir = .\routers\弧形走线
# Optional command templates. Placeholders: {board}, {target}, {layer}, {order}, {output}, {work_dir}
layer_assign_command = 
escape_order_command = 
rule_135_command = 
rule_arc_command = 
pcbrouter_bin = .\tools\reroute_helper\pcbrouter.exe
pcbrouter_timeout_seconds = 300
rule_timeout_seconds = 1800
rl_timeout_seconds = 1800


[bga_extract]
tool_path = .\tools\extract_bga_components.py
timeout_seconds = 120

[drc]
enabled = 0
tool_path = .\tools\pcb_reroute_drc.py
eval_root = .\vendor\AI-PCB-Eval
timeout_seconds = 360
work_dir = .\drc_work

[explain_model]
enabled = 0
python_executable = C:\path\to\python.exe
code_dir = .\explain_model\explain_code
checkpoint_path = .\explain_model\model\best.pt
timeout_seconds = 600

[reroute_help]
enabled = 1
max_drc_failures = 3
max_elapsed_seconds = 900

[server]
host = 0.0.0.0
port = 7074




